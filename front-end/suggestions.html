<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation - Choose Me a Movie</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/Graphics.css">
    <script src="../Back-end/themoviedb.js"></script>
    <script src="../Back-end/fetch.js" defer></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Choose Me a Movie</h1>
            <p class="subtitle">We found a movie for you!</p>
        </header>
        
        <main>
            <div class="card">
                <div class="movie-result" id="results">
                    <div class="poster" id="suggestion1">
                        <!-- Poster image will be dynamically inserted here -->
                    </div>
                    
                    <div class="movie-details">
                        <h2 class="movie-title" id="title">Loading...</h2>
                        
                        <div class="movie-info">
                            <div class="info-item">
                                <span class="info-label">Released:</span>
                                <span id="date">-</span>
                            </div>
                            
                            <div class="info-item">
                                <span class="info-label">Genre:</span>
                                <span id="genre">-</span>
                            </div>
                            
                            <div class="info-item">
                                <span class="info-label">Rating:</span>
                                <span id="rating">-</span><span>/10</span>
                            </div>
                            
                            <div class="info-item">
                                <span class="info-label">Streaming on:</span>
                                <span id="streaming">Loading...</span>
                            </div>
                        </div>
                        
                        <div class="movie-overview">
                            <h3>Overview</h3>
                            <p id="overview">Loading movie information...</p>
                        </div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button type="button" class="btn btn-secondary" onclick="document.location='./hquestion4.html'">Previous</button>
                    <button type="button" class="btn" onclick="document.location='./suggestions.html'">New Choice</button>
                    <button type="button" class="btn btn-accent" onclick="document.location='./index.html'">Start Over</button>
                </div>
            </div>
        </main>
        
        <footer>
            <p><a href="https://www.alext.dev/" target="_blank">Made by Alex Turianskyj</a> | <a href="https://www.themoviedb.org/" target="_blank">Powered by TMDB</a></p>
        </footer>
    </div>
    
    <script>
        // Initialize page on load
        window.onload = function() {
            getChoices();
        };
    </script>
</body>
</html>
