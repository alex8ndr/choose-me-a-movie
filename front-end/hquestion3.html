<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Streaming Services - Choose Me a Movie</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/Graphics.css">
    <script src="../Back-end/fetch.js" defer></script>
    <script type="text/javascript" src="../Back-end/themoviedb.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Choose Me a Movie</h1>
            <p class="subtitle">Stop scrolling. Start watching.</p>
        </header>
        
        <main>
            <div class="card">
                <form class="question-form" id="streamForm" onsubmit="handleSubmit(event)">
                    <h2>Which streaming services do you have?</h2>
                    <div class="options">
                        <label class="option-label">
                            <input type="checkbox" name="stream" value="8">
                            <span class="option-text">Netflix</span>
                        </label>
                        <label class="option-label">
                            <input type="checkbox" name="stream" value="119">
                            <span class="option-text">Amazon Prime</span>
                        </label>
                        <label class="option-label">
                            <input type="checkbox" name="stream" value="350">
                            <span class="option-text">Apple TV+</span>
                        </label>
                        <label class="option-label">
                            <input type="checkbox" name="stream" value="337">
                            <span class="option-text">Disney+</span>
                        </label>
                        <label class="option-label">
                            <input type="checkbox" name="stream" value="230">
                            <span class="option-text">Crave</span>
                        </label>
                        <!--
                        <label class="option-label">
                            <input type="checkbox" name="stream" value="384">
                            <span class="option-text">Max (formerly HBO Max)</span>
                        </label>
                        -->
                        <label class="option-label">
                            <input type="checkbox" name="stream" value="531">
                            <span class="option-text">Paramount+</span>
                        </label>
                    </div>
                    
                    <div class="navigation">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='./hquestion2.html'">Previous</button>
                        <button type="submit" class="btn">Next</button>
                    </div>
                </form>
            </div>
        </main>
        
        <footer>
            <p><a href="https://www.alext.dev/" target="_blank">Made by Alex Turianskyj</a> | <a href="https://www.themoviedb.org/" target="_blank">Powered by TMDB</a></p>
        </footer>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            const selectedServices = Array.from(document.querySelectorAll('input[name="stream"]:checked'))
                .map(cb => cb.value)
                .join('|');
            
            if (!selectedServices) {
                alert("Please select at least one streaming service");
                return;
            }
            
            sessionStorage.setItem("stream", selectedServices);
            window.location.href = './hquestion4.html';
        }
    </script>
</body>
</html>
