<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a Rating - Choose Me a Movie</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/Graphics.css">
    <script src="../Back-end/fetch.js" defer></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Choose Me a Movie</h1>
            <p class="subtitle">Stop scrolling. Start watching.</p>
        </header>
        
        <main>
            <div class="card">
                <form class="question-form" id="ratingForm" onsubmit="handleSubmit(event)">
                    <h2>How high a user score should the movie have on TMDB?</h2>
                    <div class="options">
                        <label class="option-label">
                            <input name="rating" id="80" type="radio" value="8" required>
                            <span class="option-text">80% +</span>
                        </label>
                        <label class="option-label">
                            <input name="rating" id="70" type="radio" value="7">
                            <span class="option-text">70% +</span>
                        </label>
                        <label class="option-label">
                            <input name="rating" id="60" type="radio" value="6">
                            <span class="option-text">60% +</span>
                        </label>
                        <label class="option-label">
                            <input name="rating" id="50" type="radio" value="5">
                            <span class="option-text">50% +</span>
                        </label>
                        <label class="option-label">
                            <input name="rating" id="20" type="radio" value="2">
                            <span class="option-text">Don't care</span>
                        </label>
                    </div>
                    
                    <div class="navigation">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='./hquestion3.html'">Previous</button>
                        <button type="submit" class="btn">Next</button>
                    </div>
                </form>
            </div>
        </main>
        
        <footer>
            <p><a href="https://www.alext.dev/" target="_blank">Made by Alex Turianskyj</a> | <a href="https://www.themoviedb.org/" target="_blank">Powered by TMDB</a></p>
        </footer>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            getRating();
            window.location.href = './suggestions.html';
        }
    </script>
</body>
</html>
