<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Me a Movie</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/Graphics.css">
    <script src="../Back-end/fetch.js" defer></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Choose Me a Movie</h1>
            <p class="subtitle">Stop scrolling. Start watching.</p>
        </header>
        
        <main>
            <div class="card">
                <form class="question-form" id="questionForm" onsubmit="handleSubmit(event)">
                    <h2>In which language do you want your movie to be?</h2>
                    <div class="options">
                        <label class="option-label">
                            <input id="1" name="language" type="radio" value="en" required>
                            <span class="option-text">English</span>
                        </label>
                        <label class="option-label">
                            <input id="2" name="language" type="radio" value="fr">
                            <span class="option-text">French</span>
                        </label>
                    </div>
                    
                    <div class="navigation">
                        <button type="submit" class="btn">Next</button>
                    </div>
                </form>
            </div>
        </main>
        
        <footer>
            <p><a href="https://www.alext.dev/" target="_blank">Made by Alex Turianskyj</a> | <a href="https://www.themoviedb.org/" target="_blank">Powered by TMDB</a></p>
        </footer>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            language();
            window.location.href = './hquestion1.html';
        }
    </script>
</body>
</html>
